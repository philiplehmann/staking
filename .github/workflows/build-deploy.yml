name: build & deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run typecheck
        run: yarn lint:types

  build:
    needs: typecheck
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          image: tonistiigi/binfmt:qemu-v8.1.5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to harbor.riwi.dev registry
        uses: docker/login-action@v4
        with:
          registry: harbor.riwi.dev
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: set version
        run: echo "TAG_VERSION=$(date +'%y-%m-%d').$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          push: true
          cache-from: type=registry,ref=harbor.riwi.dev/philiplehmann/staking:buildcache
          cache-to: type=registry,ref=harbor.riwi.dev/philiplehmann/staking:buildcache,mode=max,image-manifest=true
          tags: |
            harbor.riwi.dev/philiplehmann/staking:latest
            harbor.riwi.dev/philiplehmann/staking:${{ env.TAG_VERSION }}

      - uses: philiplehmann/setup-kustomize@v2.2.5
      - name: deploy
        run: |
          cd kustomize/staking
          kustomize edit set image harbor.riwi.dev/philiplehmann/staking=harbor.riwi.dev/philiplehmann/staking:${{ env.TAG_VERSION }}
      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomize/staking/kustomization.yaml
          git commit -m "Set image tag to \`${{ env.TAG_VERSION }}\`"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected, pulling latest changes before retrying (attempt ${attempt})..."
            git fetch origin main
            # Re-apply our commit on top of the latest main. If another run already
            # bumped the same image tag line, keep our version since it reflects the
            # image we just built and pushed in this run.
            git rebase -X ours origin/main
          done

          echo "Failed to push changes after multiple attempts" >&2
          exit 1
